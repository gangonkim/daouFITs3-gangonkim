<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 검색 프로그램</title>
</head>
<body>
<h1>도서검색 프로그램</h1>
<form action="search" method="POST">
    <label for="keyword">도서명 키워드 :</label>
    <input type="text" name="keyword" id="keyword" placeholder="검색어 입력" required>
    <br>
    <input type="radio" name="priceLimit" value="10000"> 10,000원 미만<br>
    <input type="radio" name="priceLimit" value="20000"> 20,000원 미만<br>
    <input type="radio" name="priceLimit" value="30000" checked> 30,000원 미만<br>
    <input type="radio" name="priceLimit" value="40000"> 40,000원 미만<br>
    <br>
    <button type="submit">도서 검색!</button>
</form>
</body>
</html>
